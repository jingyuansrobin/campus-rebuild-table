[workspace]
resolver = "2"
members = [
    "crates/campus-core",
    "crates/app-core",
    "crates/arnis-adapter",
    "apps/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

campus-core = { path = "crates/campus-core" }
app-core = { path = "crates/app-core" }
