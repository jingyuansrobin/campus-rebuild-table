[workspace]
resolver = "2"
members = [
    "crates/campus-core",
    "crates/app-core",
    "crates/gaode-search",
    "crates/gaode-map",
    "crates/arnis-adapter",
    "apps/cli",
    "apps/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
ureq = "2.12"
urlencoding = "2"
winit = "0.30.13"
wry = "0.56.1"

campus-core = { path = "crates/campus-core" }
app-core = { path = "crates/app-core" }
gaode-search = { path = "crates/gaode-search" }
gaode-map = { path = "crates/gaode-map" }
arnis-adapter = { path = "crates/arnis-adapter" }
